name: Update mecha profile views

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/scripts/update-profile-views.mjs'
      - '.github/assets/mecha-views-template.svg'
      - '.github/workflows/profile-views.yml'

concurrency:
  group: mecha-profile-views
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Render panel with current counter value
        run: node .github/scripts/update-profile-views.mjs
        env:
          PROFILE_USERNAME: ${{ github.repository_owner }}
      - name: Publish panel
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: profile-views-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
