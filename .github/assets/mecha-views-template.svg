<svg xmlns="http://www.w3.org/2000/svg" width="850" height="264" viewBox="0 0 850 264" role="img" aria-labelledby="title desc">
  <title id="title">StarNezz — Bintang Putra</title>
  <desc id="desc">Developer and technology explorer. __COUNT__ profile views, synchronized __UPDATED__. Animated Gundam-inspired helmet.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0c1629"/><stop offset="1" stop-color="#070c16"/></linearGradient>
    <linearGradient id="armor" x2=".8" y2="1"><stop stop-color="#f4f8fc"/><stop offset=".55" stop-color="#bfcede"/><stop offset="1" stop-color="#6c859f"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#23507b" stop-opacity=".55"/><stop offset="1" stop-color="#102031" stop-opacity="0"/></radialGradient>
    <clipPath id="panel"><rect x="1" y="1" width="848" height="262" rx="18"/></clipPath>
  </defs>
  <style>
    .mecha{animation:float 7s ease-in-out infinite}.eyes,.signal{animation:glow 4s ease-in-out infinite}.orbit{transform-origin:683px 132px;animation:orbit 48s linear infinite}
