    @keyframes glow{0%,100%{opacity:.55}50%{opacity:1}}
    @keyframes orbit{to{transform:rotate(360deg)}}
    @media(prefers-reduced-motion:reduce){.mecha,.eyes,.orbit,.signal{animation:none}}
  </style>
